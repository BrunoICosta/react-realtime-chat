<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Chat em tempo real com React, Socket.io e TypeScript. Salas, presença e indicador de digitação."
    />
    <meta name="theme-color" content="#4f46e5" />
    <title>Realtime Chat</title>
    <script>
      // Apply the saved theme before the first paint to avoid a light flash.
      try {
        var t = localStorage.getItem('rrc:theme')
        if (t !== 'light' && t !== 'dark')
          t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
